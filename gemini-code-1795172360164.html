<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulář pro vrácení / reklamaci zboží | SimpleFit - GEAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1d24; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00E5FF; }
    </style>
</head>
<body class="bg-[#0f1115] min-h-screen text-gray-300 font-sans p-4 sm:p-8 flex items-center justify-center selection:bg-cyan-500 selection:text-white">

    <div class="w-full max-w-2xl bg-[#161920] rounded-2xl shadow-2xl border border-gray-800 overflow-hidden">
        
        <!-- Header with SimpleFit - GEAR Branding -->
        <div class="px-6 py-8 sm:py-10 border-b border-gray-800 flex flex-col items-center text-center bg-[#13151a]">
            <!-- Custom Logo Image -->
            <img src="logo.jpg" alt="SimpleFit - GEAR Logo" class="max-h-20 max-w-[240px] mb-4 object-contain drop-shadow-[0_0_15px_rgba(0,229,255,0.3)]" onerror="this.style.display='none'">
            
            <!-- Brand Name Typography -->
            <div class="text-4xl sm:text-5xl font-extrabold tracking-tight mb-2">
                <span class="text-white font-sans">Simple</span><span class="text-[#00E5FF] font-sans drop-shadow-[0_0_12px_rgba(0,229,255,0.4)]">Fit</span>
            </div>
            
            <!-- GEAR Sub-brand with flanking lines -->
            <div class="flex items-center justify-center space-x-3 text-gray-300 text-sm sm:text-base tracking-[0.45em] uppercase font-light mb-6 w-full max-w-xs">
                <span class="flex-1 h-[1px] bg-gradient-to-r from-transparent via-gray-500 to-gray-300"></span>
                <span class="px-1 text-gray-200 font-medium">GEAR</span>
                <span class="flex-1 h-[1px] bg-gradient-to-l from-transparent via-gray-500 to-gray-300"></span>
            </div>
            
            <h1 class="text-xl sm:text-2xl font-semibold text-white">Formulář pro vrácení / reklamaci zboží</h1>
        </div>

        <!-- Form Area - Single Column Flow -->
        <div id="form-container" class="p-6 sm:p-10">
            <form id="return-form" class="space-y-6 sm:space-y-8">
                
                <!-- 1. Order Number -->
                <div class="space-y-2">
                    <label for="order_number" class="block text-sm font-semibold text-gray-200">
                        Číslo objednávky <span class="text-cyan-400">*</span>
                    </label>
                    <div class="relative">
                        <input type="text" id="order_number" name="order_number" required
                            class="w-full px-4 py-3 bg-[#0b0c10] border border-gray-700 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 transition-all shadow-inner"
                            placeholder="Např. 202612345">
                        <!-- Loading Spinner -->
                        <div id="order-loading" class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-cyan-400">
                            <i class="fa-solid fa-circle-notch fa-spin text-lg"></i>
                        </div>
                    </div>
                    <p id="order-helper-text" class="text-xs text-gray-500">Zadejte číslo vaší objednávky pro načtení zakoupených produktů.</p>
                    <p id="order-error-text" class="hidden text-xs text-red-400 font-medium"></p>
                </div>

                <!-- Order Products Selection Box -->
                <div id="order-products-container" class="hidden fade-in bg-[#0b0c10] border border-cyan-900/60 rounded-xl p-4 sm:p-5 space-y-4 shadow-[0_0_15px_rgba(0,229,255,0.08)]">
                    <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                        <div>
                            <p class="text-xs text-cyan-400 font-semibold uppercase tracking-wider">Zakoupené produkty</p>
                            <p id="order-meta-info" class="text-xs text-gray-400 mt-0.5"></p>
                        </div>
                        <span class="text-xs text-gray-400 bg-[#161920] px-2.5 py-1 rounded-md border border-gray-800">Vyberte položky</span>
                    </div>

                    <!-- Dynamic Product List -->
                    <div id="products-list"
