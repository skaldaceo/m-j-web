<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje objednávky | SimpleFit Gear</title>
    <!-- Tailwind CSS a FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0b0f14] text-white min-h-screen font-sans flex flex-col justify-between">

    <!-- HLAVIČKA / NAVBAR -->
    <header class="border-b border-gray-800 bg-[#11161d]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3 text-cyan-400 font-extrabold text-xl tracking-wide">
                <img src="logo.jpeg" alt="SimpleFit Gear" class="w-9 h-9 rounded-lg object-cover border border-cyan-500/30">
                <span>SimpleFit <span class="text-white">Gear</span></span>
            </a>
            <a href="index.html" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs sm:text-sm rounded-xl font-medium transition-colors flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Zpět do obchodu
            </a>
        </div>
    </header>

    <!-- HLAVNÍ OBSAH -->
    <main class="max-w-4xl mx-auto px-4 py-10 w-full flex-1">
        <div class="border-b border-gray-800 pb-5 mb-8">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white flex items-center gap-3">
                <i class="fa-solid fa-box-archive text-cyan-400"></i> Moje objednávky
            </h1>
            <p class="text-xs sm:text-sm text-gray-400 mt-1.5">Kompletní historie a detailní přehled vašich nákupů na SimpleFit Gear</p>
        </div>

        <!-- Seznam objednávek -->
        <div id="detailed-user-orders-list" class="space-y-4">
            <div class="text-center py-12 text-gray-400">
                <i class="fa-solid fa-spinner fa-spin text-cyan-400 text-2xl mb-3 block"></i>
                Načítám přehled objednávek...
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-gray-800 py-6 text-center text-xs text-gray-500">
        © 2026 SimpleFit Gear. Všechna práva vyhrazena.
    </footer>

    <script>
        // Správná URL (vvfs na konci) a anon klíč z tvého index.html
        const SUPABASE_URL = 'https://rtqujirvdyzkdmxzvvfa.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_OBjCg-l66656Z0CLFqQ7jw_4QoqgaZB';
        
        let client = null;

        function getClient() {
            if (client) return client;
            if (typeof supabase !== 'undefined' && typeof supabase.createClient === 'function') {
                client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } else if (window.supabaseClient) {
                client = window.supabaseClient;
            }
            return client;
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadDetailedUserOrders, 200);
        });

        async function loadDetailedUserOrders() {
            const container = document.getElementById('detailed-user-orders-list');
            if (!container) return;

            try {
                const db = getClient();
                if (!db || typeof db.from !== 'function') {
                    throw new Error("Nepodařilo se připojit k Supabase.");
                }

                // Načtení z tabulky orders
                const { data: orders, error } = await db
                    .from('orders')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                // Vyfiltrování podle e-mailu m7skalicky
                const userOrders = (orders || []).filter(o => 
                    o.customer_email && o.customer_email.toLowerCase().includes('m7skalicky')
                );

                if (userOrders.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-12 bg-[#141921] border border-gray-800 rounded-2xl p-6">
                            <i class="fa-solid fa-box-open text-4xl text-gray-600 mb-3 block"></i>
                            <h3 class="text-lg font-bold text-gray-300">Zatím nemáte žádné objednávky</h3>
                            <p class="text-xs text-gray-500 mt-1">Po dokončení prvního nákupu se zde zobrazí kompletní detail.</p>
                        </div>`;
                    return;
                }

                // Vykreslení karet objednávek
                container.innerHTML = userOrders.map((order, idx) => {
                    const date = new Date(order.created_at).toLocaleDateString('cs-CZ', {
                        day: 'numeric',
                        month: 'numeric',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    const cartItems = Array.isArray(order.cart_items) ? order.cart_items : [];
                    const itemsCount = cartItems.reduce((sum, item) => sum + (item.quantity || 1), 0);

                    const itemsListHtml = cartItems.map(item => `
                        <div class="flex items-center justify-between bg-[#0e1217] p-3 rounded-xl border border-gray-800/80">
                            <div class="flex items-center space-x-3">
                                <img src="${item.image || 'logo.jpeg'}" alt="${item.name}" class="w-12 h-12 object-cover rounded-lg border border-gray-800 bg-gray-900">
                                <div>
                                    <div class="font-bold text-white text-sm">${item.name}</div>
                                    <div class="text-xs text-gray-400">${item.quantity}× ${Number(item.price).toLocaleString('cs-CZ')} Kč</div>
                                </div>
                            </div>
                            <div class="font-bold text-cyan-400 text-sm">
                                ${(item.quantity * item.price).toLocaleString('cs-CZ')} Kč
                            </div>
                        </div>
                    `).join('');
                    
let qrHtml = '';
    if (order.payment_method === 'qr') {
        const vs = order.id.replace(/[^0-9]/g, '').substring(0, 10) || '1001';
        const amt = Math.round(Number(order.total_price));
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(`SPD*1.0*ACC:CZ4555000000000779805004*AM:${amt}.00*CC:CZK*X-VS:${vs}`)}`;
        
        qrHtml = `
            <div class="p-4 bg-[#12151b] border border-cyan-500/20 rounded-xl flex items-center justify-between mt-4">
                <div>
                    <h4 class="text-cyan-400 font-bold text-sm mb-1">Dodatečná úhrada objednávky</h4>
                    <p class="text-xs text-gray-400 max-w-[250px] leading-relaxed">Pokud jste ještě neuhradili za objednávku, prosíme o rychlé uhrazení.</p>
                    <div class="text-white font-extrabold text-sm mt-2">Celkem k úhradě: ${amt.toLocaleString('cs-CZ')} Kč</div>
                </div>
                <div class="bg-white p-2 rounded-xl shadow-lg border border-gray-700">
                    <img src="${qrUrl}" alt="QR Platba" class="w-20 h-20 object-contain">
                </div>
            </div>
        `;
    }
                    return `
                        <div class="bg-[#141921] border border-gray-800 rounded-2xl overflow-hidden transition-all duration-200">
                            <button type="button" onclick="toggleOrderDetail('order-detail-${idx}')" class="w-full p-5 text-left flex flex-wrap items-center justify-between gap-4 hover:bg-[#191f2a] transition-colors">
                                <div class="space-y-1">
                                    <div class="flex items-center gap-3">
                                        <span class="font-extrabold text-white text-base">Objednávka #${order.id.slice(0, 8)}</span>
                                        <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold ${
                                            order.status === 'vyřízená' 
                                            ? 'bg-green-500/10 text-green-400 border border-green-500/20' 
                                            : 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20'
                                        }">
                                            ${order.status || 'nová'}
                                        </span>
                                    </div>
                                    <div class="text-xs text-gray-400">Vytvořeno: ${date} • Celkem položek: ${itemsCount}</div>
                                </div>

                                <div class="flex items-center gap-4">
                                    <div class="text-right">
                                        <div class="text-xs text-gray-500 uppercase tracking-wider">Celková částka</div>
                                        <div class="font-extrabold text-cyan-400 text-lg">${Number(order.total_price).toLocaleString('cs-CZ')} Kč</div>
                                    </div>
                                    <i class="fa-solid fa-chevron-down text-gray-400 transition-transform duration-200" id="arrow-order-detail-${idx}"></i>
                                </div>
                            </button>

                            <div id="order-detail-${idx}" class="hidden border-t border-gray-800/80 p-5 bg-[#10141b] space-y-5">
                                <div>
                                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Zakoupené produkty</h4>
                                    <div class="space-y-2">
                                        ${itemsListHtml}
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs bg-[#151b24] p-4 rounded-xl border border-gray-800">
                                    <div>
                                        <div class="text-gray-500 font-medium mb-1">Doručovací údaje:</div>
                                        <div class="font-bold text-white">${order.customer_name}</div>
                                        <div class="text-gray-300">${order.delivery_address || 'Adresa neuvedena'}</div>
                                        <div class="text-gray-400 mt-1">${order.customer_email} • ${order.customer_phone}</div>
                                    </div>
                                    <div>
                                        <div class="text-gray-500 font-medium mb-1">Doprava a platba:</div>
                                        <div class="text-gray-300"><b class="text-white">Doprava:</b> ${order.shipping_method || 'Standardní'}</div>
                                        <div class="text-gray-300"><b class="text-white">Platba:</b> ${order.payment_method || 'QR platba / Převod'}</div>
                                    <div id="order-detail-${idx}" class="hidden border-t border-gray-800/80 p-5 bg-[#10141b] space-y-5">
    <div>
        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Zakoupené produkty</h4>
        <div class="space-y-2">
            ${itemsListHtml}
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs bg-[#151b24] p-4 rounded-xl border border-gray-800">
        <div>
            <div class="text-gray-500 font-medium mb-1">Doručovací údaje:</div>
            <div class="font-bold text-white">${order.customer_name}</div>
            <div class="text-gray-300">${order.delivery_address || 'Adresa neuvedena'}</div>
            <div class="text-gray-400 mt-1">${order.customer_email} • ${order.customer_phone}</div>
        </div>
        <div>
            <div class="text-gray-500 font-medium mb-1">Doprava a platba:</div>
            <div class="text-gray-300"><b class="text-white">Doprava:</b> ${order.shipping_method || 'Standardní'}</div>
            <div class="text-gray-300"><b class="text-white">Platba:</b> ${order.payment_method || 'QR platba / Převod'}</div>
        </div>
    </div>
    
   <!-- QR kód pro dodatečnou úhradu -->
        ${order.payment_method === 'qr' ? `
            <div class="mt-4 p-4 bg-[#12151b] border border-cyan-500/20 rounded-xl flex items-center justify-between">
                <div>
                    <h4 class="text-cyan-400 font-bold text-sm mb-1">Dodatečná úhrada objednávky</h4>
                    <p class="text-xs text-gray-400 max-w-[250px] leading-relaxed">Pokud jste ještě neuhradili za objednávku, prosíme o rychlé uhrazení.</p>
                    <div class="text-white font-extrabold text-sm mt-2">Celkem k úhradě: ${Math.round(Number(order.total_price)).toLocaleString('cs-CZ')} Kč</div>
                </div>
                <div class="bg-white p-2 rounded-xl shadow-lg border border-gray-700">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(`SPD*1.0*ACC:CZ4555000000000779805004*AM:${Math.round(Number(order.total_price))}.00*CC:CZK*X-VS:${order.id.replace(/[^0-9]/g, '').substring(0, 10) || '1001'}`)}" alt="QR Platba" class="w-20 h-20 object-contain">
                </div>
            </div>
        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('Chyba při načítání:', err);
                container.innerHTML = `<div class="text-center py-8 text-red-400 text-xs">Chyba při načítání: ${err.message}</div>`;
            }
        }

        function toggleOrderDetail(detailId) {
            const detailEl = document.getElementById(detailId);
            const arrowEl = document.getElementById('arrow-' + detailId);
            if (detailEl) {
                detailEl.classList.toggle('hidden');
                if (arrowEl) arrowEl.classList.toggle('rotate-180');
            }
        }
    </script>
</body>
</html>
